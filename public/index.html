<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="shell"><aside class="sidebar"><div><div class="brand">WEB PANEL</div><div class="muted small">Минимализм / чёрно-белый</div></div><nav class="nav"><a class="nav-link active" href="/">Главная</a><a class="nav-link" href="/logs.html">Логи</a><a class="nav-link" href="/terminal.html">Терминал</a></nav><button id="logoutBtn" class="ghost">Выйти</button></aside><main class="content"><div class="topbar"><div><h1>Главная</h1><p class="muted">Статус сервера и proxy</p></div><button id="refreshBtn" class="ghost">Обновить</button></div><section class="stats-grid"><div class="stat-card"><span class="stat-label">Статус</span><span id="status" class="stat-value">—</span></div><div class="stat-card"><span class="stat-label">IP сервера</span><span id="ip" class="stat-value mono">—</span></div><div class="stat-card"><span class="stat-label">Secret</span><span id="secret" class="stat-value mono">—</span></div><div class="stat-card"><span class="stat-label">Tag</span><span id="tag" class="stat-value mono">—</span></div><div class="stat-card"><span class="stat-label">Ping</span><span id="ping" class="stat-value">—</span></div><div class="stat-card wide"><span class="stat-label">Ссылка Telegram</span><span id="link" class="stat-value mono">—</span><div class="inline-actions"><button id="copyLinkBtn" class="ghost">Копировать</button><button id="restartBtn">Перезапустить</button></div></div></section><section class="panel-card"><div class="section-head"><h2>Tag</h2><button id="clearTagBtn" class="ghost">Удалить tag</button></div><div class="input-row"><input id="tagInput" maxlength="32" placeholder="Введите 32 hex tag"><button id="setTagBtn">Сохранить</button></div></section><div id="message" class="toast"></div></main></div><script src="/js/dashboard.js"></script></body></html>
