<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTProxy Panel</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="container">
    <h1>MTProxy Panel</h1>

    <div class="actions top-actions">
      <button id="refreshBtn">Обновить</button>
      <a class="button-link" href="/logs.html">Открыть логи</a>
      <a class="button-link" href="/terminal.html">Открыть терминал</a>
    </div>

    <div class="grid">
      <div class="card">
        <h3>Статус</h3>
        <p id="status">Загрузка...</p>
      </div>

      <div class="card">
        <h3>IP сервера</h3>
        <p id="ip">-</p>
      </div>

      <div class="card">
        <h3>Secret</h3>
        <p id="secret" class="mono">-</p>
      </div>

      <div class="card">
        <h3>Tag</h3>
        <p id="tag" class="mono">-</p>
      </div>

      <div class="card card-wide">
        <h3>Ссылка Telegram</h3>
        <p id="link" class="mono">-</p>
        <div class="actions">
          <button id="copyLinkBtn">Скопировать ссылку</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Управление</h3>

      <div class="actions">
        <button id="restartBtn">Перезапустить прокси</button>
        <button id="clearTagBtn">Удалить tag</button>
      </div>

      <div class="tag-form">
        <input id="tagInput" type="text" maxlength="32" placeholder="Введите 32 hex tag" />
        <button id="setTagBtn">Установить tag</button>
      </div>

      <div class="danger-zone">
        <button id="uninstallBtn" class="danger">Полностью удалить proxy</button>
      </div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
